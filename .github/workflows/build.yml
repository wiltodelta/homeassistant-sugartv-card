name: Build

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
    pull_request:
        branches:
            - main
        paths-ignore:
            - '**.md'
            - 'docs/**'
            - '.claude/**'
    # Republishes the demo from the chosen ref, for a demo-only change that
    # should not wait for the next release.
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            build: ${{ steps.filter.outputs.build }}
        steps:
            - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  filter: blob:none

            - name: Detect build-relevant changes
              id: filter
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
                  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
              run: |
                  if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
                      echo "build=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
                      base="$BASE_SHA"
                      head="$HEAD_SHA"
                  else
                      base="$BEFORE_SHA"
                      head="$GITHUB_SHA"
                  fi
                  if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]] \
                      || ! files=$(git diff --name-only "$base" "$head" 2>/dev/null) \
                      || [[ -z "$files" ]]; then
                      echo "build=true" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  build=false
                  while IFS= read -r file; do
                      [[ -z "$file" ]] && continue
                      case "$file" in
                          *.md|docs/*|.claude/*) ;;
                          *) build=true; break ;;
                      esac
                  done <<< "$files"
                  echo "build=$build" >> "$GITHUB_OUTPUT"

    build:
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            # The demo follows stable releases, so it shows what HACS installs.
            PUBLISH_DEMO: ${{ (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch' }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0 # Needed to get all tags for versioning

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Run tests
              run: npm test

            # Demo pages reach their assets by relative path, so the site keeps
            # the repository's layout and its root only redirects to demo/.
            - name: Assemble demo site
              if: env.PUBLISH_DEMO == 'true'
              run: |
                  mkdir -p _site/demo _site/dist _site/test
                  cp demo/index.html demo/hass-mock.js _site/demo/
                  cp dist/sugartv-card.js _site/dist/
                  cp test/ha-languages.json _site/test/
                  printf '<!doctype html><meta http-equiv="refresh" content="0; url=demo/"><a href="demo/">SugarTV Card demo</a>\n' > _site/index.html

            - name: Upload demo site
              if: env.PUBLISH_DEMO == 'true'
              uses: actions/upload-pages-artifact@v5

            - name: Create release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*
                  draft: false
                  prerelease: ${{ contains(github.ref, '-') }}

    demo:
        needs: build
        if: (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')) || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}demo/
        steps:
            - name: Deploy demo to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
