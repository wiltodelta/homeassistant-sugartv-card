name: HACS validate

on:
    push:
        branches:
            - main
        paths-ignore:
            - '.claude/**'
            - 'docs/**'
    pull_request:
        branches:
            - main
        paths-ignore:
            - '.claude/**'
            - 'docs/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: HACS validate
        # The action validates the PR's head repository through the API, not
        # the checkout. A fork has no releases and dist/ is ignored, so it fails
        # there whatever the change (PR #116). Validate our own branches only.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: HACS validate
              uses: hacs/action@main
              with:
                  category: 'plugin'
