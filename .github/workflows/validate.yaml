name: HACS validate

on:
    push:
        branches:
            - main
        paths-ignore:
            - '.claude/**'
            - 'docs/**'
    pull_request:
        branches:
            - main
        paths-ignore:
            - '.claude/**'
            - 'docs/**'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: HACS validate
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - name: HACS validate
              uses: hacs/action@main
              with:
                  category: 'plugin'
